<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mostrando iframe</title>
    <style>
        iframe{
            height: 400px;
            width: 600px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Testando o uso do iframe</h1>
    <p>Acessando o site 
        <!--Um iframe tem o tamanho padrão de 300px por 150px-->
        <!--O padrão scolling faz com que tire a barra de rolagem dependendo do navegador-->
        <iframe src="https://www.cursoemvideo.com" frameborder="0" height="500px"></iframe>
        
        para aprender a programar</p>
        <p>
            O repósitorio
            
            <iframe src="https://gustavoguanabara.github.io" frameborder="0"></iframe>
            
            e muito legal!!!
        </p>
        <p>
            Esse é o meu repóditorio <iframe src="https://github.com/hugofob" frameborder="0"><a href="https://github.com/hugofob">Acesse meu repósitorio</a></iframe>
        </p>
    
</body>
</html>
