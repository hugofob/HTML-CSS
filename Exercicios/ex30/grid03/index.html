<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout na prática</title>
    <style>
        div.conteiner{
            border: 2px solid green;
            display: grid;
            grid-template: 100px 100px 100px / auto auto auto; /* Desta forma substitui o grid-template-rows e grid-template-colums */
            align-items: stretch; /*  A sigla place-itens: substitui as siglas align-itens e justify-itens */
            justify-items: center;
            align-content: start; /* A sigla place-content: substitui as siglas align-content e justify-content */
            justify-content: end;

        }

        div.item{
            border: 2px solid black;
            padding: 5px;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
        <div class="item">H</div>
        <div class="item">I</div>
    </div>
</body>
</html>
