<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout na prática</title>
    <style>
        div.conteiner{
            border: 2px solid green;
           
            display: grid;
            grid-template-columns: 80px 80px 80px; /* Coluna */
            grid-template-rows: 50px 50px 50px; /* Linha observação: usando medidas fr franções consegui-se dividiar as linhas*/
            grid-auto-rows: 50px; /* Cria uma linha nova */
            grid-auto-flow: column;
            grid-auto-columns: 80px;
            gap: 5px;
            /*align-items: start;
            justify-items: center;*/
            place-items: normal normal;
            /*align-content: space-between;
            justify-content: end;*/
            place-content: normal normal;

        }

        div.item{
            border: 2px solid black;
            padding: 5px;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
        <div class="item">H</div>
        <div class="item">I</div>
        <div class="item">J</div>
    </div>
</body>
</html>
