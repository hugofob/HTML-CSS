<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible - box</title>
    <style>
        div.conteiner{
            background-color: rgba(77, 77, 139, 0.619);
            display: flex;
            height: 100px;
            flex-direction: row;
            flex-wrap: wrap-reverse;
            /*flex-flow: column wrap;*/
        }

        div.item{
            background-color: rgba(160, 132, 132, 0.805);
            border: 1px solid black;
            text-align: center;
            flex: auto;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item">Exemplo de A</div>
        <div class="item">Exemplo de B</div>
        <div class="item">Exemplo de C</div>
        <div class="item">Exemplo de D</div>
        <div class="item">Exemplo de E</div>
        <div class="item">Exemplo de F</div>
        <div class="item">Exemplo de G</div>
        <div class="item">Exemplo de H</div>
    </div>
</body>
</html>
