<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible - box</title>
    <style>
        div.conteiner{
            background-color: rgba(77, 77, 139, 0.619);
            display: flex;
            height: 200px;
            flex-flow: row nowrap;
            justify-content: space-between; /* space-between, space-around, space-evelyn */
            align-items: stretch;
        }

        div.item{
            background-color: rgba(160, 132, 132, 0.805);
            border: 1px solid black;
            text-align: center;
            
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
        <div class="item">H</div>
    </div>
</body>
</html>
