<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible - box</title>
    <style>
        div.conteiner{
            background-color: rgba(77, 77, 139, 0.619);
            display: flex;
            flex-flow: row nowrap;
        }

        div.item{
            background-color: rgba(160, 132, 132, 0.805);
            border: 1px solid black;
            text-align: center;
            flex-basis: 250px;
        }
        div#ca{
            flex: 1 1 250px; /* flex: initial e a mesma coisa que flex: 0 1 auto */
        }
        div#cb{
            flex: 0 1 250px; /* flex: 0 0 auto (flex: none) não flexível */
        }
        div#cc{
            flex: 2 1 250px; /* flex: 1 1 auto (flex: auto) da o maximo de flexibilidade aos arquivos, flex: 3 só o grow e 3 */
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item" id="ca">Hugo</div>
        <div class="item" id="cb">Fernandes</div>
        <div class="item" id="cc">Barros</div>
    </div>
</body>
</html>
