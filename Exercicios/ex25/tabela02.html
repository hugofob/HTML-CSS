<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body{
            font-family: 'Times New Roman', Times, serif;
        }
        table{
            width: 300px;
            height: 50px;
            border-collapse: collapse; /*  unindo as tabelas */
            position: relative;
        }
        caption{
            font-size: 1em;
            font-family: Arial, Helvetica, sans-serif;
            background-color: lightgray;
            padding: 5px;
        }
        tr, th, td{
            border: 1px solid black;
            text-align: center;
            padding: 5px;
        }
        td.num{
            text-align: right;
        }
        thead > tr > th{
            position: sticky;
            top: 0;
            background-color: gray;
        }
        thead, tfoot{
            background-color: gray;
            color: white;
        }
        tbody > tr:nth-child(even){ /* Essa função faz com que de dois em dois mude de cor (odd ou even)*/
            background-color: lightgreen;
        }
       
    </style>
</head>
<body>
    <h1>Uso de tabelas grandes</h1>
    <!--ANATOMIA DAS TABELAS
    table
        caption
        thead
            tr,td,th
        tbody
            tr,td,th
        tfoot
            tr,td,th-->
    <table>
        <caption><strong>População das Unidades Federativas</strong></caption>
        <thead>
            <tr>
                <th scope="col">Estado</th>
                <th scope="col" style="width: 100px;">População</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>São Paulo</td>
                <td class="num">45 919 049</td>
            </tr>
            <tr>
                <td>Minas Gerais</td>
                <td class="num">21 750 367</td>
            </tr>
            <tr>
                <td>Rio de Janeiro</td>
                <td class="num">18 879 029</td>
            </tr>
            <tr>
                <td>Amazonas</td>
                <td class="num">16 765 456</td>
            </tr>
            <tr>
                <td>Bahia</td>
                <td class="num">14 324 789</td>
            </tr>
            <tr>
                <td>Goias</td>
                <td class="num">11 425 769</td>
            </tr>
            <tr>
                <td>Santa Catarina</td>
                <td class="num">9 024 78</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th scope="row">Total de Habitantes</th>
                <td class="num"><strong>78 547 543</strong></td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
