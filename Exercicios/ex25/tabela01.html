<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>
    <style>
        body{
            font-family: 'Times New Roman', Times, serif;
        }
        table{
            width: 300px;
            border-collapse: collapse; /*  unindo as tabelas */
        }
        tr.linha{
            background-color: rgba(81, 81, 156, 0.526);
        }
        td{
            border: 1px solid black;
            padding: 5px;
        }
        td.dado{
            background-color: brown;
        }
    </style>
</head>
<body>
    <h1>Minha primeira tabela</h1>
<!--Hierarquia de tabelas
    Table = tabelas
        Table Row = linha de tabela
            Table header = cabeçalho de tabela
                Table data = data de tabela -->
    <table>
        <tr><!--Primeira linha-->
            <td>A1</td>
            <td>B1</td>
            <td>C1</td>
        </tr>
        <tr class="linha">
            <td>A2</td>
            <td>B2</td>
            <td>C2</td>
        </tr>
        <tr>
            <td>A3</td>
            <td>B3</td>
            <td>C3</td>
        </tr>
        <tr>
            <td class="dado">A4</td>
            <td>B4</td>
            <td>C4</td>
        </tr>

    </table>
    
</body>
</html>
