<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplos de formulários</h1>
    <form action="cadastro.php" method="get">
        <fieldset>
            <legend>Esportes Radicais</legend>
            <input type="checkbox" name="esporfut" id="iesporfut"> <label for="iesporfut">Futebol</label>
            <br>
            <input type="checkbox" name="espornat" id="iespornat"> <label for="iespornat">Natação</label>
            <br>
            <input type="checkbox" name="esporbas" id="iesporbas"> <label for="iesporbas">Basquete</label>
            <br>
            <input type="checkbox" name="esporvol" id="iesporvol"> <label for="iesporvol">Volei</label>
            <br>
            <input type="checkbox" name="esporcic" id="iesporcic"> <label for="iesporcic">Ciclismo</label>
        </fieldset>
        <fieldset>
            <legend>Sexo</legend>
            <input type="radio" name="sexo" id="ismas" checked value="M"> <label for="ismas">Masculino</label><br>
            <input type="radio" name="sexo" id="isfem" value="F"> <label for="isfem">Feminino</label><!--Botões de radio sempre tem que ter o mesmo nome-->
        </fieldset>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
