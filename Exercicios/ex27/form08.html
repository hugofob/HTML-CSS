<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>
<body>
     <h1>Exemplo de formulário</h1>
    <form action="cadastro.php" method="get">
        <p>
            <label for="ium">Número 1:</label>
            <input type="number" name="um" id="ium" min="0" max="50" required oninput="isoma.innerHTML = Number(ium.value) + Number(idois.value)">
        </p><!--oniput="isoma.innerHTML = Number(ium.value) + Number(idois.value)" Código de programação JavaScript-->
        <p>
            <label for="idois">Número 2:</label>
            <input type="number" name="dois" id="idois" min="0" max="50" required oninput="isoma.innerHTML = Number(ium.value) + Number(idois.value)">
        </p>
        <p>
            <label for="isoma">Soma:</label>
            <output name="soma" id="isoma">0</output>
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
